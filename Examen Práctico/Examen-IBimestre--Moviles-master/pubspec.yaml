name: flutter_hybrid_crud
description: Hybrid CRUD with SQLite and Hive - EPN Practical Exam
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  provider: ^6.1.2

  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
